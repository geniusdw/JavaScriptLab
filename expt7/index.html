<!DOCTYPE html>
<html>
<head>
    <title>Array Objects</title>
</head>
<body>

    <input id="size" type="number" placeholder="Enter array size">
    <button onclick="createArray()">Create Array</button>
    <br><br>

    <input id="newItem" type="text" placeholder="Item to append">
    <button onclick="pushItem()">Push (append at end)</button>
    <button onclick="unshiftItem()">Unshift (append at start)</button>
    <button onclick="popItem()">Pop (remove from end)</button>
    <button onclick="shiftItem()">Shift (remove from start)</button>
    <br><br>

    <button onclick="checkArray()">Check isArray</button>

    <h3>Result:</h3>
    <p id="res"></p>

    <script src="script.js"></script>
</body>
</html>
