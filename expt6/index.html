<!DOCTYPE html>
<html>
<head>
    <title>Array Ops</title>
</head>
<body>

    <input id="arr" type="text" placeholder="Enter array items, comma separated">
    <br><br>

    <input id="removeVal" type="text" placeholder="Value to remove">
    <input id="checkVal" type="text" placeholder="Value to check">
    <br><br>

    <h3>Using Standard Array Methods</h3>
    <button onclick="removeItem()">Remove</button>
    <button onclick="checkItem()">Check Contains</button>
    <button onclick="emptyArray()">Empty Array</button>

    <h3>Without Standard Array Methods</h3>
    <button onclick="removeItemManual()">Remove</button>
    <button onclick="checkItemManual()">Check Contains</button>
    <button onclick="emptyArrayManual()">Empty Array</button>

    <h3>Result:</h3>
    <p id="res"></p>

    <script src="script.js"></script>
</body>
</html>
