<!DOCTYPE html>
<html>
<head>
    <title>String Ops</title>
</head>
<body>

    <input id="str" type="text" placeholder="Enter string">
    <br><br>

    <!-- Extra inputs needed only for the Replace operation -->
    <input id="oldChar" type="text" placeholder="Find char" style="width: 80px;">
    <input id="newChar" type="text" placeholder="Replace with" style="width: 80px;">
    <br><br>

    <!-- Task Buttons -->
    <button onclick="revStr()">1. Reverse</button>
    <button onclick="repStr()">2. Replace</button>
    <button onclick="checkPal()">3. Palindrome</button>

    <h3>Result:</h3>
    <p id="res"></p>

    <script src="script.js"></script>
</body>
</html>
